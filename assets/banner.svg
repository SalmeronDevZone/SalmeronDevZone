<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Jesús Salmerón · Data Engineer moving into DevOps &amp; Cloud</title>
  <desc id="desc">Spark, SQL, Microsoft Fabric, Python and Azure: reliable data from raw files to the warehouse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1b34"/>
      <stop offset="1" stop-color="#0a2a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="300" rx="18"/>
    </clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="300" fill="url(#bg)"/>
    <rect width="1280" height="300" fill="url(#grid)"/>
    <rect width="1280" height="300" fill="url(#glow)"/>
    <rect y="296" width="1280" height="4" fill="#2f81f7" fill-opacity="0.6"/>
  </g>

  <!-- Presentación -->
  <text x="64" y="78" class="mono" font-size="16" fill="#58a6ff">~/salmerondevzone $ whoami</text>
  <text x="64" y="140" class="sans" font-size="54" font-weight="700" fill="#f0f6fc">Jesús Salmerón</text>
  <text x="64" y="186" class="sans" font-size="28" font-weight="600"><tspan fill="#7ee787">Data Engineer</tspan><tspan fill="#8b949e" font-weight="400"> → </tspan><tspan fill="#79c0ff" font-size="24">DevOps &amp; Cloud</tspan></text>
  <text x="64" y="222" class="sans" font-size="17" fill="#8b949e">Spark · SQL · Microsoft Fabric · Python · Azure</text>
  <text x="64" y="252" class="sans" font-size="16" font-style="italic" fill="#c9d1d9">Reliable data, from raw files to the warehouse.</text>

  <!-- Terminal -->
  <g transform="translate(800 40)">
    <rect width="420" height="222" rx="12" fill="#010409" fill-opacity="0.88" stroke="#30363d"/>
    <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="20" r="6" fill="#febc2e"/>
    <circle cx="62" cy="20" r="6" fill="#28c840"/>
    <text x="210" y="25" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">data@lakehouse — zsh</text>
    <g class="mono" font-size="14">
      <text x="20" y="62"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3"> python -m etl.pipeline</tspan></text>
      <text x="20" y="83"><tspan fill="#3fb950">✔</tspan><tspan fill="#8b949e"> 28 rows to gold · 7 quarantined</tspan></text>
      <text x="20" y="111"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3"> spark-submit etl_orders.py</tspan></text>
      <text x="20" y="132"><tspan fill="#3fb950">✔</tspan><tspan fill="#8b949e"> 36 partitions written (Year/Month)</tspan></text>
      <text x="20" y="160"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3"> terraform plan</tspan></text>
      <text x="20" y="181" fill="#8b949e">Plan: 12 to add, 0 to change.</text>
      <text x="20" y="207" fill="#7ee787">$</text>
      <rect class="cursor" x="34" y="194" width="9" height="17" fill="#e6edf3"/>
    </g>
  </g>
</svg>
