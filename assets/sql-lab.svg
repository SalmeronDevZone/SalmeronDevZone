    <text x="440" y="223" fill="#6e7681"># ROW_NUMBER()</text>

    <circle cx="70" cy="246" r="6" fill="#3fb950"/>
    <text x="86" y="251" fill="#e6edf3">07_huecos_e_islas</text>
    <text x="440" y="251" fill="#6e7681"># huecos e islas</text>

    <circle cx="70" cy="274" r="6" fill="#3fb950"/>
