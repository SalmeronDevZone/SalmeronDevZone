<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
  <title id="t">Insight_Horizon: medallion ETL pipeline</title>
  <desc id="d">Raw CSV files go to bronze, pass data quality rules into silver or quarantine, and end in a gold star schema.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d2238"/>
    </linearGradient>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b949e"/>
    </marker>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .titulo { font-size: 17px; font-weight: 700; fill: #f0f6fc; }
      .sub { font-size: 12.5px; fill: #8b949e; }
      .linea { stroke: #8b949e; stroke-width: 2; fill: none; marker-end: url(#flecha); }
    </style>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>

  <text x="40" y="52" class="sans" font-size="22" font-weight="700" fill="#f0f6fc">Medallion ETL pipeline</text>
  <text x="40" y="78" class="sans sub">Python · SQLite · stdlib only</text>

  <!-- raw -->
  <rect x="40" y="140" width="140" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="110" y="178" text-anchor="middle" class="sans titulo">Raw CSV</text>
  <text x="110" y="200" text-anchor="middle" class="sans sub">dirty on purpose</text>
  <text x="110" y="218" text-anchor="middle" class="mono sub">SHA-256</text>

  <!-- bronze -->
  <rect x="220" y="140" width="140" height="92" rx="10" fill="#2a1d10" stroke="#cd7f32"/>
  <text x="290" y="178" text-anchor="middle" class="sans titulo" fill="#e3a869">Bronze</text>
  <text x="290" y="200" text-anchor="middle" class="sans sub">as received</text>
  <text x="290" y="218" text-anchor="middle" class="sans sub">(audit)</text>

  <!-- calidad -->
  <path d="M440 146 L494 186 L440 226 L386 186 Z" fill="#161b22" stroke="#d29922"/>
  <text x="440" y="183" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#e3b341">quality</text>
  <text x="440" y="199" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#e3b341">rules</text>

  <!-- silver -->
  <rect x="530" y="140" width="140" height="92" rx="10" fill="#1b2230" stroke="#9aa8bd"/>
  <text x="600" y="178" text-anchor="middle" class="sans titulo" fill="#c9d4e3">Silver</text>
  <text x="600" y="200" text-anchor="middle" class="sans sub">clean &amp; typed</text>
  <text x="600" y="218" text-anchor="middle" class="sans sub">upserts</text>

  <!-- cuarentena -->
  <rect x="370" y="290" width="140" height="80" rx="10" fill="#2d1214" stroke="#f85149"/>
  <text x="440" y="324" text-anchor="middle" class="sans titulo" fill="#ff7b72">Quarantine</text>
  <text x="440" y="346" text-anchor="middle" class="sans sub">with every reason</text>

  <!-- gold -->
  <rect x="516" y="282" width="258" height="140" rx="10" fill="#2b2410" stroke="#e3b341"/>
  <text x="645" y="312" text-anchor="middle" class="sans titulo" fill="#f2cc60">Gold · star schema</text>
  <rect x="603" y="330" width="84" height="30" rx="6" fill="#3d3314" stroke="#e3b341"/>
  <text x="645" y="350" text-anchor="middle" class="mono" font-size="12" fill="#f2cc60">fact_ventas</text>
  <text x="574" y="392" text-anchor="middle" class="mono" font-size="11" fill="#c9d1d9">dim_cliente</text>
  <text x="645" y="408" text-anchor="middle" class="mono" font-size="11" fill="#c9d1d9">dim_fecha</text>
  <text x="716" y="392" text-anchor="middle" class="mono" font-size="11" fill="#c9d1d9">dim_producto</text>
  <path d="M603 352 L586 378 M645 360 L645 394 M687 352 L704 378" stroke="#8b6f1f" stroke-width="1.5"/>

  <!-- flechas -->
  <path d="M180 186 L214 186" class="linea"/>
  <path d="M360 186 L380 186" class="linea"/>
  <path d="M494 186 L524 186" class="linea"/>
  <path d="M440 226 L440 284" class="linea" stroke="#f85149"/>
  <path d="M600 232 L600 276" class="linea"/>

  <!-- pie -->
  <g class="sans" font-size="13.5">
    <text x="40" y="462" fill="#7ee787">✓ idempotent</text>
    <text x="160" y="462" fill="#7ee787">✓ incremental</text>
    <text x="288" y="462" fill="#7ee787">✓ late corrections</text>
    <text x="440" y="462" fill="#7ee787">✓ 13 tests</text>
    <text x="540" y="462" fill="#7ee787">✓ CI on GitHub Actions</text>
  </g>
</svg>
